[package]
name = "trade-converter-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arrow = "56.2"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
memory-stats = "1.2"
parquet = { version = "56.2", features = ["arrow", "zstd"] }
regex = "1.11"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
